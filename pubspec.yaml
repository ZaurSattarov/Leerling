name: leerling_app
description: Rijschool Leerling App – student app voor rijschool leerlingen
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.0

  # Live Aankomst (Feature 2, Fase 3): Google Maps als basemap voor de
  # lesauto-marker -- uitsluitend deze app; de Instructeur-app toont in V1
  # geen kaart. Vereist native API-key-configuratie, zie
  # android/local.properties (MAPS_API_KEY) en ios/Flutter/Secrets.xcconfig
  # (GOOGLE_MAPS_API_KEY) -- beide lokaal, nooit gecommit.
  google_maps_flutter: ^2.18.0

  # Push notificaties (Fase 5) -- gebruikt de bestaande push-dispatch
  # Edge Function + register_push_token/deactivate_push_token RPC's,
  # geen tweede backend.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.2.0

  # Deep links (Mollie-factuurbetaling return -> leerlingplanner://factuur).
  # Zelfde package/versie als de Instructeur-app (rijschool-planner-flutter),
  # bewust hergebruikt i.p.v. een nieuwe deep-link-architectuur.
  app_links: ^6.3.2

  # Datum/tijd (Nederlands)
  intl: ^0.19.0

  # Externe links (WhatsApp, betaallink, navigatie)
  url_launcher: ^6.2.5

  # Cached images
  cached_network_image: ^3.3.1

  # Foto's (avatar)
  image_picker: ^1.1.2

  # Haptic feedback
  vibration: ^2.0.0

  # Typography
  google_fonts: ^6.2.0

  # HTTP
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.2.2

  cupertino_icons: ^1.0.8

  # Factuur-PDF (bekijken/downloaden) -- zelfde packages/versies als de
  # Instructeur-app (rijschool-planner-flutter), bewust hergebruikt i.p.v.
  # een nieuwe, afwijkende PDF-implementatie: de canonical PDF-opbouw
  # (FactuurShareUtils) is 1-op-1 geport, niet opnieuw ontworpen.
  share_plus: ^12.0.2
  pdf: ^3.11.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Timer-controle in tests (Live Aankomst pollingfallback, Fase 2C) --
  # was al transitief aanwezig via flutter_test, nu expliciet gemaakt i.p.v.
  # stilzwijgend op een transitieve dependency te leunen.
  fake_async: ^1.3.3

  # Build-time generator voor de native Android launch-achtergrond (zelfde
  # architectuur/gebruik als de Instructeur-app: genereert eenmalig, via
  # `dart run flutter_native_splash:create`, de echte native
  # windowBackground/Android-12-splash-resources met het bestaande KLANTIO-
  # merk erin. Geen runtime-dependency, geen preserve/remove-lifecycle in
  # code -- Flutter's eigen automatische verwijdering bij het eerste frame
  # (standaardgedrag, zelfde als de werkende Instructeur-app) doet de rest.
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/Inlogassets/
    - assets/avatars/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Black.ttf
          weight: 900

# Native Android launch-achtergrond -- op uitdrukkelijk verzoek toont de
# verplichte native fase (Android 12+ kan het systeem-splashscherm zelf niet
# uitschakelen) GEEN eigen statisch KLANTIO-beeld meer: alleen de effen
# achtergrondkleur (AppColors.surface). Het KLANTIO-woordmerk (met de
# "LEERLINGENPORTAAL"-animatie) verschijnt daardoor voor het eerst in de
# echte, geanimeerde Flutter-splash (lib/features/splash/splash_screen.dart)
# -- geen aparte, statische "logo-only"-tussenstap meer.
#
# BELANGRIJK: het android_12-icoon wordt hierna (in
# values-v31/values-night-v31/styles.xml) handmatig expliciet naar een
# TRANSPARANTE drawable gezet (@drawable/splash_icon_transparent), NIET
# leeggelaten. Android 12+ vereist altijd een windowSplashScreenAnimatedIcon
# -- zonder expliciete override valt het systeem terug op het generieke
# @mipmap/ic_launcher (dat was eerder de oorzaak van het grote losse
# rijschool/app-icoon). Met een transparant icoon toont de verplichte
# systeem-splash alsnog niets dan de effen kleur, zonder ooit op het
# launcher-icoon terug te vallen.
#
# ios: false, net als bij Instructeur -- geen native iOS-wijzigingen.
flutter_native_splash:
  color: "#F4F5F7"
  android: true
  ios: false
  web: false
  android_12:
    color: "#F4F5F7"
