name: leerling_app
description: Rijschool Leerling App – student app voor rijschool leerlingen
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.3.0

  # State management
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.2.0

  # Datum/tijd (Nederlands)
  intl: ^0.19.0

  # Externe links (WhatsApp, betaallink, navigatie)
  url_launcher: ^6.2.5

  # Cached images
  cached_network_image: ^3.3.1

  # Foto's (avatar)
  image_picker: ^1.1.2

  # Haptic feedback
  vibration: ^2.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
